name: Pronósticos

on:
  schedule:
    - cron: '0 5 * * *' # 6:00 en invierno y 7:00 en verano, hora de Madrid
  workflow_dispatch:
    inputs:
      modo:
        description: Qué ejecutar
        type: choice
        options: [diario, backtest]
        default: diario

# Escribe pipeline/estado.json; con GITHUB_TOKEN ese commit no vuelve a publicar la web.
permissions:
  contents: write

concurrency:
  group: pronosticos
  cancel-in-progress: false

jobs:
  pronosticos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Pruebas del pipeline
        working-directory: pipeline
        run: python -m pytest tests -q

      # Los datos importados se guardan aquí, nunca en el repo público
      - uses: actions/cache@v6
        with:
          path: pipeline/datos
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Bajar los CSV
        run: bash pipeline/bajar_csv.sh pipeline/datos/csv

      - name: Ejecutar
        working-directory: pipeline
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PANEL_UID: ${{ secrets.PANEL_UID }}
          MODO: ${{ inputs.modo || 'diario' }}
        run: python -m pronosticos.main "$MODO" --datos datos --estado estado.json

      # GitHub desactiva lo programado tras 60 días sin actividad en un repo público.
      - name: Guardar el estado
        if: ${{ (inputs.modo || 'diario') == 'diario' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/estado.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Pronósticos: estado de la ejecución diaria"
          git pull --rebase origin main
          git push origin main
